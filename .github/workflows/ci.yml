name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check app/ tests/

      - name: Type-check (mypy)
        run: uv run mypy app/ --ignore-missing-imports

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Run tests
        env:
          DATABASE_URL: "postgresql+psycopg://u:p@localhost:5432/db"
          REDIS_URL: "redis://localhost:6379/0"
          OPENAI_API_KEY: "sk-test"
          FINE_TUNED_MODEL_ID: "ft:gpt-4o-mini:test:triage:abc"
          JWT_SECRET_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          INTERNAL_API_KEY: "test-key"
          LANGFUSE_PUBLIC_KEY: "pk-lf-test"
          LANGFUSE_SECRET_KEY: "sk-lf-test"
          POSTGRES_USER: "u"
          POSTGRES_PASSWORD: "p"
          POSTGRES_DB: "db"
        run: uv run pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: backend/coverage.xml
          flags: backend

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  # ── Docker build ──────────────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: medical-triage-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: medical-triage-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build celery image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.celery
          push: false
          tags: medical-triage-celery:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
