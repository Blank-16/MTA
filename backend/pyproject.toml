[project]
name = "medical-triage-backend"
version = "1.0.0"
description = "Medical triage assistant — FastAPI + RAG + restriction pipeline"
requires-python = ">=3.12"

dependencies = [
    # API framework
    "fastapi==0.124.4",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "uvloop>=0.19.0,<1.0.0",   # faster event loop
    "httptools>=0.6.0,<1.0.0", # faster HTTP parser

    # Validation
    "pydantic[email]>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "email-validator>=2.1.0,<3.0.0",

    # Database
    "psycopg[binary,pool]>=3.1.18,<4.0.0",
    "alembic>=1.13.0,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",

    # LangChain RAG
    "langchain>=0.3.0,<0.4.0",
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-postgres>=0.0.12",
    "langchain-community>=0.3.0,<0.4.0",
    "numpy>=1.26.0,<3.0.0",

    # Task queue
    "celery>=5.4.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",

    # Auth
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "bcrypt==3.2.2",
    "passlib[bcrypt]>=1.7.4,<2.0.0",

    # Rate limiting
    "slowapi>=0.1.9,<1.0.0",

    # Token counting
    "tiktoken>=0.7.0,<1.0.0",

    # Observability
    "langfuse>=2.0.0,<3.0.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-psycopg>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# uv resolves faster with a prebuilt lockfile — run `uv lock` to generate uv.lock
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "WARNING"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
